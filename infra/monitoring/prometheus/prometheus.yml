global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "bfa-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]

  # Only needed when the API runs directly on the host with uvicorn instead of in Compose.
  # Do NOT enable it together with the Compose API: on Docker Desktop host.docker.internal:8000
  # reaches that same container's published port, so every metric would be counted twice.
  # It is a separate job so a host process that is not running never makes ApiDown fire.
  # - job_name: "bfa-api-host"
  #   metrics_path: "/metrics"
  #   static_configs:
  #     - targets: ["host.docker.internal:8000"]
