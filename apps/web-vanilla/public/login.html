<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Facilities AI Assistant</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">Facilities AI Assistant</a>
  </header>

  <main>
    <div class="card">
      <h1>Sign in</h1>
      <p class="lede">Sign in with Google to report an issue, track a report, or access the manager queue.</p>

      <div id="g_id_signin"></div>

      <div id="error" class="notice"></div>
    </div>
  </main>

  <footer class="site">NUS-ISS capstone demo harness — vanilla M1 slice on Cloudflare Workers + D1.</footer>

  <script>
    const error = document.getElementById("error");
    let googleClientId = null;
    let gsiReady = false;

    function tryInit() {
      if (!gsiReady || !googleClientId) return;
      google.accounts.id.initialize({ client_id: googleClientId, callback: onCredential });
      google.accounts.id.renderButton(document.getElementById("g_id_signin"), {
        theme: "outline",
        size: "large",
        width: 300,
      });
    }

    // Called automatically by the GSI client library once it has loaded.
    window.onGoogleLibraryLoad = () => {
      gsiReady = true;
      tryInit();
    };

    async function onCredential(response) {
      error.className = "notice";
      try {
        const res = await fetch("/api/v1/auth/google", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ credential: response.credential }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Sign-in failed");
        const requestedNext = new URLSearchParams(location.search).get("next") || "/";
        const next = requestedNext.startsWith("/") &&
          !requestedNext.startsWith("//") &&
          !requestedNext.includes("\\")
          ? requestedNext
          : "/";
        location.href = next;
      } catch (err) {
        error.className = "notice err";
        error.textContent = err.message;
      }
    }

    fetch("/api/v1/auth/config")
      .then((res) => res.json())
      .then((data) => {
        if (!data.google_client_id) throw new Error("Google sign-in not configured");
        googleClientId = data.google_client_id;
        tryInit();
      })
      .catch((err) => {
        error.className = "notice err";
        error.textContent = err.message;
      });
  </script>
</body>
</html>
