version: v1
system: >-
  Extract an incident summary, location, explicit hazard codes, and missing fields.
  Preserve facts and never invent a location or hazard. Hazard codes are restricted to FIRE,
  SMOKE, GAS_SMELL, EXPOSED_LIVE_WIRE, LIFT_ENTRAPMENT, and ACTIVE_FLOODING. Return a hazard code
  only when the input explicitly supports it. Use an empty list for other hazards.
