name: Deploy portal (Cloudflare Workers)

on:
  push:
    branches: [master]
    paths:
      - "apps/web-vanilla/**"
      - ".github/workflows/deploy-portal.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/web-vanilla/**"
      - ".github/workflows/deploy-portal.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-portal
  cancel-in-progress: false

jobs:
  # PRs: validate that the Worker builds/uploads cleanly, without deploying.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-vanilla/package-lock.json
      - name: Install dependencies
        working-directory: apps/web-vanilla
        run: npm ci
      - name: Dry-run deploy
        working-directory: apps/web-vanilla
        run: npx wrangler@4 deploy --dry-run

  # master: apply idempotent D1 schema, then deploy to the live portal.
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nusiss-bfa.co01y4p.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-vanilla/package-lock.json
      - name: Install dependencies
        working-directory: apps/web-vanilla
        run: npm ci
      - name: Apply D1 schema (idempotent)
        working-directory: apps/web-vanilla
        run: npx wrangler@4 d1 execute nusiss-bfa-db --remote --file schema.sql -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        working-directory: apps/web-vanilla
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
